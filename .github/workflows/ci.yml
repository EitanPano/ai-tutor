name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      AI_PROVIDER: fake
    services:
      postgres:
        image: postgres:18
        env:
          # CI-only throwaway credentials for an ephemeral service container; not a real secret.
          POSTGRES_USER: ai_tutor
          POSTGRES_PASSWORD: ai_tutor
          POSTGRES_DB: ai_tutor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_tutor -d ai_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Generate API types and verify they are committed
        run: |
          bun run gen:api
          git diff --exit-code frontend/src/types/api.ts
      - run: bun run db:migrate
      - run: bun run test
      - name: Install Playwright chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: error
